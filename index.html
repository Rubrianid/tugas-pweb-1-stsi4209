<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-bg">
    <main class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="img/logo_ut.png" alt="Logo UT" style="width: 80px; height: auto;">
            </div>
            
            <div class="login-logo">SITTA UT</div>
            <p style="text-align: center; color: #64748b; margin-bottom: 25px;">Universitas Terbuka, UPBJJ SURABAYA</p>
            
            <form id="loginForm">
                <!-- Tambahan Label Email -->
                <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                    <label for="email" class="form-label">Alamat Email</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="contoh: rina@ut.ac.id" required>
                    </div>
                </div>
                
                <!-- Tambahan Label Password -->
                <div class="form-group" style="margin-bottom: 10px; text-align: left;">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Masukkan password Anda" required>
                    </div>
                </div>
                
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="#" id="btnLupaPassword" style="font-size: 0.85em; text-decoration: none; color: var(--primary-blue); font-weight: 600;">Lupa password?</a>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>

                <div style="text-align: center; margin-top: 20px;">
                    <span style="font-size: 0.9em; color: #64748b;">Belum punya akun? <a href="#" id="btnDaftar" style="text-decoration: none; color: var(--primary-blue); font-weight: 600;">Daftar di sini</a></span>
                </div>
            </form>
        </div>
    </main>

    <div id="modalLupa" class="modal">
        <div class="modal-card" style="padding: 25px; max-width: 400px; margin-top: 15vh;">
            <span class="close-modal" id="closeLupa" style="top: 15px; right: 15px;">&times;</span>
            <h3 style="margin-bottom: 10px; color: var(--text-dark);">Reset Password</h3>
            <p style="color: #64748b; font-size: 0.9em; margin-bottom: 15px;">Masukkan email terdaftar Anda untuk menerima tautan reset password.</p>
            
            <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                <label class="form-label">Email Terdaftar</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" placeholder="Email Anda" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
            </div>
            <button class="btn-primary" style="background-color: var(--secondary-yellow); width: 100%;">Kirim Tautan</button>
        </div>
    </div>

    <div id="modalDaftar" class="modal">
        <div class="modal-card" style="padding: 25px; max-width: 400px; margin-top: 15vh;">
            <span class="close-modal" id="closeDaftar" style="top: 15px; right: 15px;">&times;</span>
            <h3 style="margin-bottom: 10px; color: var(--text-dark);">Daftar Akun Baru</h3>
            <p style="color: #64748b; font-size: 0.9em; margin-bottom: 15px;">Silakan isi data diri Anda untuk pendaftaran UT-Daerah.</p>
            
            <div class="form-group" style="margin-bottom: 10px; text-align: left;">
                <label class="form-label">Nama Lengkap</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" placeholder="Nama Lengkap sesuai KTP/KTM" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                <label class="form-label">Alamat Email</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" placeholder="Email UT atau pribadi" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
            </div>
            
            <button class="btn-primary" style="width: 100%;">Buat Akun</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
